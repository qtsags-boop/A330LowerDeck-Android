name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # The GitHub ubuntu runner ships with the Android SDK (ANDROID_HOME) and accepted licenses;
      # the Android Gradle Plugin downloads platform 34 / build-tools automatically if missing.
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk A330-HamHang-3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: A330-HamHang-3D-apk
          path: A330-HamHang-3D.apk
      - name: Publish APK to the 'apk' branch
        run: |
          mkdir -p /tmp/out && cp A330-HamHang-3D.apk /tmp/out/
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add A330-HamHang-3D.apk
          git commit -q -m "APK build ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" A330-HamHang-3D.apk \
            --title "A330 Hầm hàng 3D – $TAG" \
            --notes "Bản APK (debug, tự ký) build từ commit ${GITHUB_SHA::7}. Cài trên Android 7.0+; bật cho phép cài ứng dụng từ nguồn không xác định. Đăng nhập: Test/123 – Admin/VIAA." \
            --target "$GITHUB_SHA"
