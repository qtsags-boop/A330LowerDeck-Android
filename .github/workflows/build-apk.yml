name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # The GitHub ubuntu runner ships with the Android SDK (ANDROID_HOME) and accepted licenses;
      # the Android Gradle Plugin downloads platform 34 / build-tools automatically if missing.
      - name: Build debug APK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk A330-HamHang-3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: A330-HamHang-3D-apk
          path: A330-HamHang-3D.apk
